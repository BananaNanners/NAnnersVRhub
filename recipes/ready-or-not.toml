id = "ready-or-not"
name = "Ready or Not (VRO mod)"
steam_appid = 1144200
mod_page = "https://www.nexusmods.com/readyornot/mods/6914"
# Nexus needs a login, so the user downloads the file themselves and points the hub at it.
manual_download = true

setup = [
  "Download the VRO zip from the mod page (a Nexus login is needed).",
  "Click 'Install mod file…' and choose the zip.",
  "Copy the launch options above into the game's Steam Properties > General.",
  "In that same screen, choose 'DirectX 11' in the launch option dropdown if it's offered; otherwise add -d3d11 to the launch options.",
  "In the game's controller settings, turn aim assist intensity off.",
]

play = [
  "Start WiVRn and connect the Quest before launching.",
  "Launch from Steam in flat mode, then pick your loadout and mission.",
  "Once the mission has loaded, press U to switch to VR. The Home key exits VR.",
]

good_to_know = [
  "If you ever used UEVR on this game, do a full reinstall first (uninstall it, then delete the game folder).",
]

[[files]]
kind = "pak"
dest = "ReadyOrNot/Content/Paks"   # relative to the Steam install folder

[launch]
# From the mod page (Step 2). -autoVR is optional: boots into VR 3s after a mission loads.
args = "-usehmd -VRTweaks -VRMappings"
optional_args = "-autoVR"
# UNTESTED guess: lets Steam's Proton container see the host OpenXR runtime (WiVRn).
env = { PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES = "1" }

[[updates]]
name = "Ready or Not VRO (Nexus)"
nexus_game = "readyornot"
nexus_mod = 6914
tracks = ["ready-or-not"]
