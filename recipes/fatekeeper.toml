id = "fatekeeper"
name = "Fatekeeper (UEVR + FK profile)"
steam_appid = 2186990
mod_page = "https://github.com/jbusfield/FK_UEVR/releases/tag/1.0.0"
manual_download = true
# No dedicated VR mod: Unreal Engine 5 game played through UEVR plus a community profile.
method = "uevr"

setup = [
  "Install protontricks, then launch Fatekeeper once from Steam (Proton on) so its Proton prefix exists.",
  "Download UEVR_FK.zip and SLASHER-Win64-Shipping.zip from the release page (link above).",
  "Once only: install the .NET 6 Desktop Runtime into the game's prefix with: protontricks-launch --no-bwrap --appid 2186990 --no-background-wineserver <windowsdesktop-runtime-6.0.x-win-x64.exe>",
  "Click 'Install mod file…' and choose UEVR_FK.zip.",
  "Click 'Install profile…' and choose SLASHER-Win64-Shipping.zip (any existing UEVR data for the game is backed up first).",
  "In the game's graphics settings, turn DLSS Frame Generation off.",
]

play = [
  "Start WiVRn and connect the Quest.",
  "Launch Fatekeeper from Steam and get into actual gameplay.",
  "Click 'Run UEVR injector', pick the Fatekeeper process, tick OpenXR, then press Inject.",
  "Put the headset on. To confirm the profile loaded, press Insert: the Fatekeeper config should appear in UEVR's left panel below 'Script UI'.",
]

good_to_know = [
  "Don't use UEVR's own 'Import Config': under Wine it silently copies only some of the files (no hands, broken eyes).",
  "UEVR_FK.zip contains a community-modified UEVRBackend.dll, and the profile ships plugin DLLs. They run inside the game process, so use them at your own discretion.",
]

[profile]
dir = "Roaming/UnrealVRMod/SLASHER-Win64-Shipping"   # under the prefix's AppData
page = "https://github.com/jbusfield/FK_UEVR/releases/tag/1.0.0"

[launch]
args = ""
# Lets the Proton container see the host OpenXR runtime (WiVRn). Worked-with setup: see notes.
env = { PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES = "1" }

[[updates]]
name = "FK_UEVR (UEVR build + profile)"
github = "jbusfield/FK_UEVR"
tracks = ["fatekeeper", "fatekeeper:profile"]

[requirements]
openxr = "wivrn"
proton_prefix = true
