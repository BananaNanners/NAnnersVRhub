[project]
name = "nannersvrhub"
version = "0.2.0"
description = "NAnnersVRhub: Linux VR mod hub (CachyOS / WiVRn / Quest 3)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nannersvrhub = "vrhub.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vrhub"]
