[project]
name = "nannersvrhub"
version = "0.4.0"
description = "NAnnersVRhub: Linux VR mod hub (CachyOS / WiVRn / Quest 3)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nannersvrhub = "vrhub.launcher:main"
nannersvrhub-cli = "vrhub.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vrhub"]

[tool.setuptools.package-data]
vrhub = ["assets/*.png"]
