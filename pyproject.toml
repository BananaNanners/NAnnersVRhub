[project]
name = "nannersvrhub"
version = "0.5.3"
description = "NAnnersVRhub: Linux VR mod hub (CachyOS / WiVRn / Quest 3)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
nannersvrhub = "vrhub.launcher:main"
nannersvrhub-cli = "vrhub.cli:main"
nannersvrhub-check = "vrhub.guard:main"
nannersvrhub-manage = "vrhub.self_install:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vrhub"]

[tool.setuptools.package-data]
vrhub = ["assets/*.png", "recipes/*.toml", "controls/*.toml"]

[tool.setuptools.exclude-package-data]
vrhub = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.nannersvrhub]
required_kharvox_installer = "0.2.0"
required_recipes = ["cyberpunk-2077", "doom-2016-gog", "elden-ring", "fatekeeper", "hogwarts-legacy", "ready-or-not", "skyrim-vr-mgo", "subnautica", "valheim"]
required_controller_guides = ["cyberpunk-2077", "doom-2016-gog", "elden-ring", "fatekeeper", "hogwarts-legacy", "ready-or-not", "skyrim-vr-mgo", "subnautica", "valheim"]
