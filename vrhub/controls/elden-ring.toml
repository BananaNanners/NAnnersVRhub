id = "elden-ring"
title = "Elden Ring — ERVR"
scope = "Quest / Touch defaults from the inspected ERVR 0.4.0 archive. Physical first-person combat and button mode differ; no local Linux gameplay test is recorded."
version = "ERVR 0.4.0 · experimental Steam / Proton / WiVRn"
reviewed = "2026-10-20"
notes = ["Offline / EAC-disabled play only. This controller reference does not configure or verify the launch route.", "Full stereo is evaluated in a loaded offline save; title screens, menus, loading and cutscenes intentionally use cinema.", "ERVR.ini has no in-headset settings menu in this version. Review [Buttons], [MenuNav], [Movement] and [Combat] for customization. The confusingly named LeftGripPlusStickIsDpad setting is documented in this archive as left-stick click + tilt, not grip + tilt.", "Normal game menus suppress physical swing combat and use the left stick for navigation. Mount, full-body, weapon-specific and gesture behavior need separate local tests."]

[sources.archive]
label = "Inspected ERVR 0.4.0 archive"
detail = "README.md and ERVR.ini from the user-supplied Nexus ZIP; controls are documented defaults, not local gameplay evidence."
url = "https://www.nexusmods.com/eldenring/mods/10711"

