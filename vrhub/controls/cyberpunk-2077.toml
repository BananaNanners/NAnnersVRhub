id = "cyberpunk-2077"
title = "Cyberpunk 2077 — CyberpunkVR Port"
scope = "Right-handed on-foot defaults from the port. Native Controller remaps and mod settings can override them."
version = "CyberpunkVR Port 0.1.7"
reviewed = "2026-10-20"
notes = ["Successful local workaround: F10 → General → VR menu quad OFF; HUD → Enable HUD panel OFF; World-space interactions / dialogs OFF. Close F10 completely.", "The menu/passthrough limitation remains. The presence of this guide does not change the experimental compatibility status.", "Consult the port’s Bindings page and native Controller settings for the active mapping."]

[sources.upstream]
label = "Port 0.1.7 control guide"
detail = "Maintainer README: on-foot and driving defaults. Individual mappings have not all been tested locally."
url = "https://github.com/dariulone/cyberpunk-vr-port/blob/0.1.7/README.md"

[sources.local]
label = "User report · Oct 18, 2026"
detail = "Immersive rendering, tracking, controllers and stereo passed; menu/HUD workaround required."
user_report = true

