id = "fatekeeper"
title = "Fatekeeper — FK UEVR profile"
scope = "Stock UEVR controller translation plus FK profile 1.0.0. Review remaps if your community build differs."
version = "FK_UEVR 1.0.0"
reviewed = "2026-10-20"
notes = ["Button-by-button FK defaults are source-derived, not a claim that every listed action passed a local test.", "Input Config controls movement orientation and turn settings. Menu and interactive UI modes can change button behavior."]

[sources.upstream]
label = "FK 1.0.0 input script"
detail = "Profile keyboard/action translation; paired with UEVR’s default Quest button translation."
url = "https://github.com/jbusfield/FK_UEVR/blob/1.0.0/scripts/main.lua"

[sources.uevr]
label = "UEVR default bindings"
detail = "Generic controller defaults; community profiles can remap game actions."
url = "https://docs.uevr.io/usage/vr_controller_bindings.html"

[sources.local]
label = "User report · Oct 18, 2026"
detail = "Insert closed the in-game overlay and restored immersion with 2D Screen Mode off. The controller overlay combination also opened WayVR. The user corrected the combination to L2 + R3 on October 20."
user_report = true

