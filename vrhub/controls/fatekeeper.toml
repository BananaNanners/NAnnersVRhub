id = "fatekeeper"
title = "Fatekeeper — FK UEVR profile"
scope = "Right-handed FK v1.0.4 reference with stock UEVR translation. Menus, grip ownership and profile settings can change actions."
version = "FK_UEVR v1.0.4"
reviewed = "2026-11-25"
notes = ["General controller operation passed on November 24; individual v1.0.4 actions still need gameplay checks.", "When a grip is already holding an item, it can take priority over shoulder and mouth gestures.", "The author mapping panel names X and B; UEVR can translate physical face buttons differently. Check the active prompts.", "If the UEVR overlay shortcut also opens WayVR, use Insert instead."]

[sources.upstream]
label = "FK v1.0.4 controller mapping"
detail = "Tagged main.lua mapping panel and input callbacks; physical face-button translation depends on UEVR."
url = "https://github.com/jbusfield/FK_UEVR/blob/v1.0.4/scripts/main.lua"

[sources.uevr]
label = "UEVR default bindings"
detail = "Generic controller defaults; community profiles can remap game actions."
url = "https://docs.uevr.io/usage/vr_controller_bindings.html"

[sources.local]
label = "User report · Oct 18, 2026"
detail = "Insert closed the in-game overlay and restored immersion with 2D Screen Mode off. The controller overlay combination also opened WayVR. The user corrected the combination to L2 + R3 on October 20."
user_report = true

[sources.gameplay]
label = "Dev5E5 gameplay acceptance · Nov 24, 2026"
detail = "Both controllers worked after the verified backend was installed; no individual v1.0.4 binding certification."
user_report = true

