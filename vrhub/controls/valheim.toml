id = "valheim"
title = "Valheim — VHVR"
scope = "Default Oculus Touch / Quest layout. Right-handed build controls; custom bindings or handedness settings can differ."
version = "VHVR 0.11.2"
reviewed = "2026-10-20"
notes = ["User reported successful basic building and both controllers during at least 30 minutes of gameplay; this does not establish that every listed combination works.", "Rotation remains a follow-up test. If the right-grip + stick combination does not work, report it; do not replace the tested bindings blindly.", "Steam Compatibility must select Proton for this game. Steam Linux Runtime uses the native Linux build even if a global Proton preference is set."]

[sources.upstream]
label = "VHVR 0.11.2 bindings"
detail = "Author binding JSON, including grip + stick building chords. Rotation is documented, not yet user-confirmed on WiVRn/xrizer."
url = "https://github.com/brandonmousseau/vhvr-mod/blob/v0.11.2/Unity/ValheimVR/Assets/StreamingAssets/SteamVR/bindings_oculus_touch.json"

[sources.local]
label = "User report · Oct 20, 2026"
detail = "At least 30 minutes; rendering, tracking, stereo and controllers passed; basic building worked, piece rotation was not found."
user_report = true

