id = "ready-or-not"
title = "Ready or Not — VRO"
scope = "VRO controls, not the separate Ready or Not UEVR profile. Right-handed defaults; tablet settings can change handedness."
version = "VRO maintainer guide (1031 page)"
reviewed = "2026-10-20"
notes = ["The full trigger, grip, face-button and reload map depends on the installed VRO build and handedness options. Use its tablet prompts for actions not listed here.", "Only the VR-entry/exit workflow has a specific local success reference here; the other combinations are author-documented defaults.", "The Hub’s VRO launch/setup guidance remains in Setup guide. Do not substitute bindings from the unrelated UEVR mod."]

