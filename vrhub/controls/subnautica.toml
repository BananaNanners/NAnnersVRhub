id = "subnautica"
title = "Subnautica — SubmersedVR"
scope = "Stock Oculus Touch / Quest bindings. The user reverted the experimental Menu/PDA override and prefers this layout."
version = "SubmersedVR 0.2.1"
reviewed = "2026-10-20"
notes = ["The in-game binding editor was reported to get stuck waiting for input without a working cancel. Keep stock bindings for this tested setup.", "Y → UIAssign did not work in the external-binding experiment. Use the tested A-drag method instead.", "The Meta system button is reserved by the headset. The failed system-button PDA experiment is not part of this guide."]

