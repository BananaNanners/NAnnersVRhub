id = "hogwarts-legacy"
title = "Hogwarts Legacy — HL UEVR"
scope = "Heroic/Epic workflow with the matching HL profile. Gesture features are optional; enable them in the profile before using them."
version = "HL_UEVR v2.0.6"
reviewed = "2026-10-20"
notes = ["Glyph drawing requires the spell to have been learned. Gesture-cast spells need not occupy the four active spell slots.", "Voice casting, mount steering, healing, Protego/Stupefy gestures and body tracking remain unverified on this Linux setup.", "The tested Heroic one-click injector route is unchanged. This guide does not alter the installed profile or its settings."]

[sources.upstream]
label = "HL v2.0.6 gesture guide"
detail = "Maintainer instructions for glyph casting, wrist recasting, custom gestures and mounts."
url = "https://github.com/jbusfield/HL_UEVR/blob/v2.0.6/README.md"

[sources.uevr]
label = "UEVR default bindings"
detail = "Generic controller defaults; community profiles can remap game actions."
url = "https://docs.uevr.io/usage/vr_controller_bindings.html"

[sources.local]
label = "User report · Oct 19, 2026"
detail = "Core VR, both controllers, spell drawing and wrist-flick activation worked during a short gameplay test."
user_report = true

