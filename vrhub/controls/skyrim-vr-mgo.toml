id = "skyrim-vr-mgo"
title = "Skyrim VR Mad God Overhaul - NSFW"
scope = "MGO 3.8.8.1: right-handed Vanilla Quest / Touch layout with the user-confirmed trigger-ready exception. Triggers do not draw or ready sheathed weapons; normal combat and casting remain available once weapons or spells are readied."
version = "MGO 3.8.8.1 · Vanilla + trigger-ready exception"
reviewed = "2026-11-25"
notes = ["This reference replaces the previous VRIK V2.1.0 example with the Vanilla layout reviewed and approved by the user on October 20, 2026.", "Trigger-ready exception: pressing either trigger while weapons are sheathed must not draw or ready them. Once readied, triggers retain their normal combat, power-attack and spell-casting actions.", "This is the requested guide layout, not a scan or automatic change of the installed game bindings. Keep the separate active MGO/OpenComposite preset and mod settings consistent with your chosen layout.", "Plain Vanilla is different from Vanilla + Oculus Touch, VRIK, Kvite, Cangar and VR Safe. Other presets or left-handed settings may differ.", "The successful MGO test confirmed VR/controllers overall. This review does not create a new gameplay test or certify every listed action.", "The player-approved Vanilla layout is retained. Current MGO documentation describes other presets; do not substitute them for this layout. Mod controls below are conditional references for mods enabled in the reviewed 3.8.8.1 MO2 list, not a scan of their active settings."]

