id = "skyrim-vr-mgo"
title = "Skyrim VR — Mad God’s Overhaul"
scope = "MGO 3.8: right-handed Vanilla Quest / Touch layout with the user-confirmed trigger-ready exception. Triggers do not draw or ready sheathed weapons; normal combat and casting remain available once weapons or spells are readied."
version = "MGO 3.8 · Vanilla + trigger-ready exception"
reviewed = "2026-10-20"
notes = ["This reference replaces the previous VRIK V2.1.0 example with the Vanilla layout reviewed and approved by the user on October 20, 2026.", "Trigger-ready exception: pressing either trigger while weapons are sheathed must not draw or ready them. Once readied, triggers retain their normal combat, power-attack and spell-casting actions.", "This is the requested guide layout, not a scan or automatic change of the installed game bindings. Keep the separate active MGO/OpenComposite preset and mod settings consistent with your chosen layout.", "Plain Vanilla is different from Vanilla + Oculus Touch, VRIK, Kvite, Cangar and VR Safe. Other presets or left-handed settings may differ.", "The successful MGO test confirmed VR/controllers overall. This review does not create a new gameplay test or certify every listed action."]

[sources.local]
label = "User-reviewed layout · Oct 20, 2026"
detail = "The user approved the Vanilla controls table and confirmed that triggers cannot ready sheathed weapons but retain normal combat/casting once readied. This is configuration guidance, not a new live test."
user_report = true

[sources.upstream]
label = "MGO OpenComposite preset guide"
detail = "Documents plain Vanilla as a separate preset; does not establish the active preset or the custom trigger exception."
