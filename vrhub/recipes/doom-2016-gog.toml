id = "doom-2016-gog"
name = "DOOM (2016) (GOG/Heroic + KHARVOX, experimental)"
store = "heroic-gog"
heroic_appid = "1390579243"
method = "guide"
handler = "kharvox-gog"
manual_download = true
mod_page = "https://github.com/CactusVRStudios/KHARVOX/releases/tag/v1.4.0"
setup = [
 "Launch the flat GOG game once through native Heroic. Keep its existing prefix. DOOMx64vk.exe is the supported Vulkan executable; DOOMx64.exe is OpenGL.",
 "Extract the complete KHARVOX 1.4 release outside DOOM, then use Choose KHARVOX folder…. The Hub checks the package and supported GOG executable before launching.",
 "Close DOOM and KHARVOX, then click Install VR runner. This reuses the verified isolated runner or obtains the pinned Proton-CachyOS11.0-20260703-slr x86_64 release from upstream and applies the lab 0.1.6 bridge. The separate bridge component archive and all payload files are verified first; the base archive and seven baseline files are then checked. Heroic runner selection stays unchanged.",
 "Connect the headset through WiVRn and click Test VR bridge. A full matching lab 0.1.6 pass is required. Existing standalone lab state is reused from ~/.local/share/nanners-kharvox-lab/0.1.0.",
 "The Hub installs its separate pinned bridge component only when requested. Before its public release, use Import bridge package with the matching 0.2.0 source archive. This keeps ordinary Hub updates small.",
]
play = [
 "Connect WiVRn and use Launch DOOM VR. The Hub starts the tested isolated runner through umu-run, using the existing native Heroic GOG prefix. No original runner or game files are replaced.",
 "In KHARVOX select the complete GOG DOOM installation, keep SFS selected, enable Extended Logging if troubleshooting, and choose Launch Game. Shift+left-click Made by Cactus exposes the developer controls.",
 "Load a campaign save to evaluate VR gameplay. The user reported 40 minutes with both controllers and head tracking working on October 21, 2026. Stereo depth and individual control actions were not separately reported in that session.",
 "Open DOOM diagnostics opens the launch/probe/audit log folder and probe-results subfolder. Game log diagnostics also reads the KHARVOX main log and bridge logs as historical evidence.",
 "Keep the DOOM window focused. Review upstream guidance before changing graphics quality in a loaded level.",
]
good_to_know = [
 "The dated gameplay reference covers KHARVOX 1.4, SFS and isolated lab 0.1.6 on one CachyOS/WiVRn/NVIDIA setup. A synthetic bridge pass does not verify current headset rendering or gameplay.",
 "Launch DOOM (flat) remains a normal Heroic launch. Other games and local gameplay-test history are not rewritten by this profile.",
 "Windows Vulkan-layer activation stays in KHARVOX's child process. Do not add its Windows DLL to host Linux Vulkan layer paths.",
]
