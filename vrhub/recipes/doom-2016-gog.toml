id = "doom-2016-gog"
name = "DOOM (2016) (GOG/Heroic + KHARVOX, experimental)"
store = "heroic-gog"
heroic_appid = "1390579243"
method = "guide"
handler = "kharvox-gog"
manual_download = true
mod_page = "https://github.com/CactusVRStudios/KHARVOX/releases/tag/v1.4.0"
setup = [
  "Launch the GOG game once through native Heroic. Keep the existing game environment. The supported game executable is DOOMx64vk.exe (Vulkan).",
  "Download KHARVOX 1.4 from the linked release page. Scan the ZIP in Install / Update; Review installation checks compatibility only and does not extract it.",
  "Extract the tested KHARVOX package outside the DOOM folder, then use Select KHARVOX folder in the Hub. Other versions require review.",
  "Close DOOM and KHARVOX. In Install / Update, click Install VR Runner. The Hub downloads and verifies NAnners KHARVOX Bridge 0.2.0 and prepares the separate VR runner if needed. Your original Heroic runner stays unchanged.",
  "If automatic bridge downloading fails, download NAnners-KHARVOX-Bridge-0.2.0-source.tar.gz from the linked bridge release and use Import KHARVOX Bridge. Do not use GitHub's automatic Source code archives. This also prepares the runner.",
  "Connect WiVRn and click Test VR Setup in Overview. A matching lab 0.1.6 pass is required before launch.",
]
play = [
  "With your headset connected, click Launch DOOM VR. The Hub uses its isolated runner with your existing Heroic GOG game environment.",
  "In KHARVOX, select the complete GOG DOOM installation, keep SFS selected and choose Launch Game. Keep the DOOM window focused.",
  "Load a campaign save and check VR rendering, depth, tracking and controllers. Review the author guidance before changing graphics quality in a loaded level.",
  "If something fails, enable Extended Logging in KHARVOX and use Open DOOM diagnostics or Game log diagnostics.",
]
good_to_know = [
  "KHARVOX 1.4 with SFS and lab 0.1.6 passed on one CachyOS/WiVRn/NVIDIA setup. Bridge testing alone does not confirm gameplay.",
  "A standalone session lasted 40 minutes; later rc1 testing confirmed stereo depth and controller input, but individual bindings were not separately tested.",
  "Launch DOOM (flat) still uses Heroic normally. Do not add KHARVOX's Windows Vulkan DLL to Linux system Vulkan paths.",
]
