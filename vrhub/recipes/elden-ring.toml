id = "elden-ring"
name = "Elden Ring (ERVR / Steam + Proton, experimental)"
steam_appid = 1245620
method = "ervr"
handler = "elden-ring-vr"
manual_download = true
mod_page = "https://www.nexusmods.com/eldenring/mods/10711?tab=files"

setup = [
  "Experimental Linux VR setup, not yet gameplay-tested. Launch the Steam game once using Proton. Only patch 1.16.2 or 1.17.1 is accepted by this workflow; other builds need review.",
  "Back up saves and use offline-only play for this Hub workflow. Set the game's startup network setting to offline, quit, and put Steam in offline mode. Do not use online play or launch with Easy Anti-Cheat enabled.",
  "Download ERVR 0.4.0 from the author's Nexus Files page. Scan local archives and choose Install verified dependencies when the correct ZIP is verified. Review backups before approval.",
  "Remove conflicting ReShade, other VR frameworks or existing loader files using their original removal instructions. The Hub blocks conflicting files rather than overwriting them.",
  "Copy the Hub launch options into Steam Properties > General. Keep your existing Proton selection. Connect WiVRn before launch.",
]
play = [
  "Keep the game and Steam offline. Launch using the reviewed Steam settings; if a protected launch appears, close the game and review the setup.",
  "Menus, cutscenes and loading screens may appear as a flat panel by design. Load an offline save to test stereo VR, tracking, movement and both controllers.",
  "Start with the supplied settings. Reduce GameResScale or graphics if needed. This release uses ERVR.ini rather than an in-headset settings menu.",
  "Check Game log diagnostics if loading fails and record the actual gameplay result.",
]
good_to_know = [
  "The archive was inspected but not gameplay-tested on Linux. The bundled ReShade digest matched its included documentation, not an independently verified upstream copy.",
  "Do not mix UEVR or OpenComposite with this native OpenXR mod. Multiplayer is outside the Hub's tested scope.",
  "Hub removal preserves original files and edited text settings; changed binaries block removal. ERVR may leave logs or graphics settings requiring separate restoration. Saves are not install targets.",
]

[[guide_links]]
label = "ERVR author guide and controls"
url = "https://www.nexusmods.com/eldenring/mods/10711"

[[guide_links]]
label = "ERVR 0.4.0 downloads"
url = "https://www.nexusmods.com/eldenring/mods/10711?tab=files"

[[links]]
label = "ERVR author guide and controls"
url = "https://www.nexusmods.com/eldenring/mods/10711"
[[links]]
label = "ERVR 0.4.0 download"
url = "https://www.nexusmods.com/eldenring/mods/10711?tab=files"
[[links]]
label = "Proton WineOpenXR bridge (upstream)"
url = "https://github.com/ValveSoftware/Proton/tree/proton_11.0/wineopenxr"

[[packages]]
id = "ervr"
name = "ERVR 0.4.0 + bundled ReShade 6.8.0"
page = "https://www.nexusmods.com/eldenring/mods/10711?tab=files"
sha256 = "851221c337d2a365df547b34435246486f4e390a77999b1fe712e764ef33a21a"
required_files = ["Game/dxgi.dll", "Game/dinput8.dll", "Game/ReShade.ini", "Game/LICENSE-ReShade.txt", "Game/ERVR/ERVR.dll", "Game/ERVR/ERVR.ini", "Game/ERVR/README.md", "Game/ERVR/CHANGELOG.md", "Game/ERVR/LICENSE.txt", "Game/ERVR/THIRD_PARTY.md"]

[launch]
args = ""
env = { WINEDLLOVERRIDES = '"dxgi,dinput8=n,b"', PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES = "1", PRESSURE_VESSEL_FILESYSTEMS_RW = '"$XDG_RUNTIME_DIR/wivrn/comp_ipc"' }

[requirements]
openxr = "wivrn"
proton_prefix = true

[compatibility]
runtime = "WiVRn"
validation = "unverified"
proton = "Keep this game's existing Steam-selected Proton and prefix. No successful Linux runner build is recorded for ERVR."
adapter = "ERVR's own OpenXR session and bundled ReShade D3D12 add-on through Proton WineOpenXR -> WiVRn; no host xrizer/OpenComposite selection is required by this recipe. Actual loading is unverified."
launch = "Game + Steam offline settings -> WiVRn connected -> Steam with reviewed copied options -> Hub executable adapter -> Game/eldenring.exe -> loaded offline save."
requirements = [
  "Keep Steam/game offline and use the unprotected executable route. No multiplayer/EAC-enabled testing.",
  "Use an inspected ERVR 0.4.0 archive and a documented executable version (2.6.2.0 or 2.7.1.0).",
  "Review both native DLL overrides, WineOpenXR runtime import and WiVRn IPC exposure in the actual Steam settings.",
]
manual_checks = [
  "Review Steam offline mode, the game's offline startup setting and the actual launch options. The Hub does not inspect network isolation or certify an EAC state.",
  "Verify the WineOpenXR/D3D12 session, full stereo after loading a save, tracking, both controllers, movement, interactions and combat. Menus/cutscenes intentionally use cinema.",
]
notes = [
  "The reviewed ERVR 0.4.0 ZIP contains ten files. Download checks confirm the expected ZIP; installed-file checks confirm that files are present, not that the game loads them correctly.",
  "No dated local gameplay test is recorded. The mod author’s documentation is not proof of successful Linux VR gameplay.",
]
[compatibility.checks]
recorded_proton = true
tracked_install = true
game_files = ["Game/eldenring.exe", "Game/dxgi.dll", "Game/dinput8.dll", "Game/ERVR/ERVR.dll", "Game/ERVR/ERVR.ini"]
