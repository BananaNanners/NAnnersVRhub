id = "hogwarts-legacy"
name = "Hogwarts Legacy (Heroic/Epic + UEVR)"
store = "heroic-epic"
handler = "heroic-uevr"
heroic_title = "Hogwarts Legacy"
method = "uevr"
manual_download = true
mod_page = "https://github.com/jbusfield/HL_UEVR/releases/tag/v2.0.6"

setup = [
  "Launch your Epic copy once using Heroic. Keep the game's existing Wine/Proton runner and Windows environment.",
  "Download UEVR.zip and HogwartsLegacy.zip from the HL_UEVR v2.0.6 release. Do not mix versions or substitute Fatekeeper files.",
  "In Install / Update, scan local archives and review both downloads. The Hub checks profile backups and recovery requirements. Live installation and profile replacement remain blocked in this preview.",
  "In Heroic's game environment variables, set PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES to 1 when using Proton. Do not paste Steam's %command% into Heroic.",
  "If UEVR requests .NET, use Heroic's game Settings > Wine > Run EXE on prefix to install the Windows x64 .NET 6 Desktop Runtime. Do not use Steam protontricks for this Epic copy.",
  "Disable DLSS Frame Generation and HDR for the initial VR test.",
]

play = [
  "Start WiVRn, connect your headset and launch Hogwarts Legacy through Heroic.",
  "Wait for shaders to finish and the main menu. Click Run UEVR injector. If native Heroic launch fails or you use Flatpak, follow the displayed manual Heroic instructions.",
  "Select HogwartsLegacy and OpenXR in UEVR, then Inject. Load a save. Turn off 2D Screen Mode if needed and close the in-game overlay with Insert.",
  "Check rendering, depth, tracking, movement and spell casting. Record the gameplay result in the Hub.",
]

good_to_know = [
  "Keep the matching v2.0.6 packages. Newer v2.1.0 installation instructions and older 1.x add-ons are not interchangeable with this setup.",
  "Use the Hub profile installation when authorized, not UEVR Import Config. Never delete your game saves; the VR profile is separate.",
  "The October 19 test confirmed one-click injector launch, tracking, controllers, stereo depth, spell drawing and wrist flicks. Voice, body tracking, other gestures and longer sessions remain untested.",
]

[[guide_links]]
label = "Hogwarts Legacy VR v2.0.6 (UEVR and profile)"
url = "https://github.com/jbusfield/HL_UEVR/releases/tag/v2.0.6"

[[guide_links]]
label = "Hogwarts Legacy VR guide"
url = "https://github.com/jbusfield/HL_UEVR"

[[guide_links]]
