id = "fatekeeper"
name = "Fatekeeper (UEVR + FK profile)"
steam_appid = 2186990
mod_page = "https://github.com/praydog/UEVR-nightly/releases/tag/nightly-01133-38c73f314ac61a1b6fabc37fba75c4149d3a8823"
manual_download = true
guide_links_only = true
# No dedicated VR mod: Unreal Engine 5 game played through UEVR plus a community profile.
method = "uevr"

setup = [
  "Install protontricks and launch Fatekeeper once through Steam using your existing Proton selection.",
  "Download UEVR Nightly 1133 (uevr.zip) and Fatekeeper VR Profile v1.0.4 (SLASHER-Win64-Shipping.zip) from the linked release pages.",
  "Install the Windows x64 .NET 6 Desktop Runtime into this game's Windows environment using protontricks-launch --no-bwrap --appid 2186990 --no-background-wineserver followed by the downloaded installer path.",
  "In Install / Update, scan local archives and choose Review installation. Review both downloads and the backup warnings. Live installation is blocked in this preview.",
  "During an authorized installation, the Hub obtains and verifies the required JoeyHodge backend if missing. No third ZIP or manual DLL copying is needed.",
  "Copy the Hub launch options into Steam Properties > General. Turn off DLSS Frame Generation in the game.",
]

play = [
  "Start WiVRn and connect your headset. Launch Fatekeeper in Steam and load gameplay.",
  "Click Run UEVR injector, select the Fatekeeper process and OpenXR, then Inject.",
  "Press Insert to check that the Fatekeeper profile appears below Script UI. Turn off 2D Screen Mode and close the in-game overlay with Insert before judging VR.",
]

good_to_know = [
  "Do not use UEVR Import Config under Wine; it can leave profile files missing. Use the Hub's reviewed installation workflow when authorized.",
  "The tested backend and profile plugins run inside the game. Existing profiles require backup and recovery review before replacement.",
  "The controller overlay shortcut can also open WayVR's menu. Use Insert instead.",
]

