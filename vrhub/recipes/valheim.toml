required_files = ["winhttp.dll", "doorstop_config.ini", "BepInEx/config/BepInEx.cfg", "BepInEx/core/BepInEx.dll", "BepInEx/core/BepInEx.Preloader.dll"]
[[packages]]
id = "vhvr"
name = "VHVR 0.11.2"
page = "https://github.com/brandonmousseau/vhvr-mod/releases/tag/v0.11.2"
sha256 = "118fca4c797298cc41eb0667aff89b329801a31ee65ef72878fb876858196dae"
required_files = ["BepInEx/plugins/ValheimVRMod.dll", "valheim_Data/Managed/SteamVR.dll", "valheim_Data/Managed/Unity.XR.OpenVR.dll", "valheim_Data/Managed/Unity.XR.Management.dll", "valheim_Data/Plugins/x86_64/openvr_api.dll", "valheim_Data/Plugins/x86_64/XRSDKOpenVR.dll", "valheim_Data/UnitySubsystems/XRSDKOpenVR/UnitySubsystemsManifest.json", "valheim_Data/StreamingAssets/SteamVR/actions.json", "valheim_Data/StreamingAssets/SteamVR/bindings_oculus_touch.json", "valheim_Data/StreamingAssets/steamvr_player_prefabs", "valheim_Data/StreamingAssets/xrmanager"]

[launch]
args = "-force-d3d11 -flatScreenMode=false -ModEnabled=true -UseVRControls=true -UseOverlayGui=false"
env = { WINEDLLOVERRIDES = "winhttp=n,b", PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES = "1", PRESSURE_VESSEL_FILESYSTEMS_RW = '"$XDG_RUNTIME_DIR/wivrn/comp_ipc"' }

[[updates]]
name = "VHVR (pinned GitHub build; review newer releases)"
github = "brandonmousseau/vhvr-mod"
tracks = ["valheim"]

[requirements]
openxr = "wivrn"
proton_prefix = true

[compatibility]
runtime = "WiVRn"
validation = "user-reported"
proton = "Use the Windows Steam build through the game's selected Proton and its own prefix. The October 20 successful report records proton-cachyos-slr from prefix config_info; exact build and running Steam selection were not captured."
adapter = "VHVR's installed Unity/OpenVR backend -> host xrizer -> WiVRn/OpenXR. Host selection and installed payloads do not prove which runtime libraries the game loads."
launch = "WiVRn connected -> Steam Play Valheim with Proton/D3D11 and copied VHVR flags -> loaded character/world. No UEVR injector."
requirements = [
  "Select Proton for the Windows game and review current game/mod version compatibility.",
  "Install the pinned Valheim loader and complete VHVR release ZIPs together.",
  "Connect WiVRn with host xrizer selected before launching.",
  "Review Steam's actual winhttp override, runtime visibility and VHVR -flatScreenMode=false / motion-control flags.",
]
manual_checks = [
  "Review the actual Steam-selected Proton, Windows game version, Direct3D 11 choice, launch arguments and existing mod conflicts; these are not verified from the Hub environment.",
  "Verify headset rendering, head tracking, stereo depth, both controllers, movement, inventory, building and combat in a loaded world. Multiplayer, gestures, trackers and long-session behavior need their own tests.",
]
notes = [
  "VHVR 0.11.0 names Valheim 1.0.15–1.0.17; v0.11.2 is a follow-up release without a new explicit game-version range. Review other versions before proceeding.",
  "Upstream flatScreenMode defaults to auto and checks SteamVR process state. The recipe supplies its documented false override to request VR under WiVRn; these flags are source/configuration evidence; the separate October 20 user report records successful gameplay.",
  "Archive hashes are checked at installation. Inventories check presence, not current file versions or successful DLL/plugin loading. A dated user-reported test is bundled. Its NOT READY runtime snapshot records scan-time state and is not rewritten by this reference.",
]
