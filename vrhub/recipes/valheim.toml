id = "valheim"
name = "Valheim (VHVR / Steam + Proton)"
steam_appid = 892970
handler = "valheim-vr"
method = "bepinex"
manual_download = true
mod_page = "https://github.com/brandonmousseau/vhvr-mod/releases/tag/v0.11.2"

setup = [
  "In Steam Properties > Compatibility, force your chosen Proton version so Steam installs the Windows game. Launch once and close it. The native Linux game and dedicated server are not supported by this installer.",
  "VHVR 0.11.0 lists game versions 1.0.15–1.0.17. The supported v0.11.2 follow-up does not specify a new range; other game versions need review.",
  "Download vhvr.zip (v0.11.2) and denikson-BepInExPack_Valheim-5.4.2351.zip from the linked pages. Do not download source-code ZIPs or substitute older VHVR builds.",
  "Close external mod managers and the game. Scan local archives and choose Install verified dependencies when both files are verified. Review backups and conflicts; remove an existing Hub installation before replacing it.",
  "Choose xrizer with WiVRn and copy the Hub launch options into Steam Properties > General. Keep the supplied VR and controller flags unchanged for the initial test.",
]
play = [
  "Connect the headset before launch. Choose Play Valheim with Proton and Direct3D 11, not Vulkan.",
  "Keep -flatScreenMode=false in the launch options so VHVR requests VR even without SteamVR running. No UEVR injector is needed.",
  "Load a character and world. Check tracking, stereo depth, both controllers, movement, inventory, tools, building and combat. See the in-game Compendium for controls.",
  "Record gameplay results; if the game stays flat, check Game log diagnostics.",
]
good_to_know = [
  "The October 20 test confirmed at least 30 minutes of VR and basic building. Building-piece rotation, multiplayer and optional features remain unconfirmed.",
  "Back up worlds and characters separately. Hub removal restores original files and preserves edited text settings; changed binaries or missing backups block removal.",
  "Newer releases and unrelated mods require review; the Hub does not certify them as compatible.",
]

