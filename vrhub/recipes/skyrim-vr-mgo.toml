id = "skyrim-vr-mgo"
name = "Skyrim VR (Mad God's Overhaul / WiVRn)"
steam_appid = 611670
mod_page = "https://www.nexusmods.com/skyrimspecialedition/mods/107780"
method = "guide"
handler = "skyrim-vr"
manual_download = true

setup = [
  "Before installing: at least 32 GB RAM, an internal SSD and a Steam copy of Skyrim VR. Keep game, downloads and modlist in separate folders.",
  "Install and launch clean Skyrim VR once through Steam using Proton.",
  "Install Mad God's Overhaul using Jackify. Follow the Jackify guide for its Linux dependencies and installation steps.",
  "Open Mod Organizer 2 (MO2) from your MGO installation. Enable only one OpenComposite variant: Open Composite XR or Open Composite Unleashed for Skyrim VR.",
  "Keep both VR Performance Kit variants disabled with this OpenComposite setup. Check game readiness in the Hub.",
]

play = [
  "Start WiVRn with xrizer selected and connect your headset.",
  "Launch MGO using its configured MO2 / Play Game (SKSE) shortcut, not SkyrimVR.exe directly.",
  "Disable Dynamic Resolution and set in-game Super Sampling to its lowest value.",
  "Start a new game. Wait for the background scripts to finish in the starting room before moving or saving.",
]

good_to_know = [
  "Do not run LOOT, mass-enable disabled mods or change the default load order. Do not load vanilla saves. Use Alternate Start to begin a new adventure.",
  "Jackify handles modlist installation and updates; the Hub checks the VR setup. If automatic folder detection fails, the NANNERS_MGO_DIR override is available.",
  "Use MGO's bundled OpenComposite, not a system-wide replacement. Keep PC and headset WiVRn versions matched and retest after updates.",
]

[[guide_links]]
label = "Mad God's Overhaul"
url = "https://www.nexusmods.com/skyrimspecialedition/mods/107780?tab=description"

[[guide_links]]
label = "Jackify"
url = "https://github.com/Omni-guides/Jackify"

[[guide_links]]
label = "Jackify installation guide"
url = "https://github.com/Omni-guides/Jackify/wiki"

[[links]]
label = "Jackify"
url = "https://github.com/Omni-guides/Jackify"

[[links]]
label = "MGO Nexus"
url = "https://www.nexusmods.com/skyrimspecialedition/mods/107780"







[requirements]
openxr = "wivrn"
proton_prefix = true

[handler_config]
mgo_dir_env = "NANNERS_MGO_DIR"
mgo_globs = ["SkyrimVR*MGO*", "*Skyrim*MGO*", "MGO*", "Games/SkyrimVR*MGO*", "Games/*MGO*", "Applications/SkyrimVR*MGO*", "Applications/*MGO*"]
opencomposite_mod = "Open Composite XR - Incompatible with VR Performance Kit"
opencomposite_alternatives = ["Open Composite Unleashed for Skyrim VR"]
conflicting_mod_dirs = ["VR Performance Kit", "VR Performance Kit - FSR2", "VR Performance Kit - FSR - Use with DLAA", "VR Performance Kit - CAS Sharpening - Default"]

[launch]
args = ""
env = { PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES = "1" }

[compatibility]
runtime = "WiVRn"
validation = "user-reported"
proton = "Reuse the Proton build configured for the Jackify MO2 Steam shortcut. GE-Proton10-14 is the tested reference, not a required version."
adapter = "One MGO OpenComposite variant (XR or Unleashed) enabled in the active MO2 profile; host xrizer selection is separate and does not prove which DLL the game loads."
launch = "Steam MO2 shortcut -> Mod Organizer -> configured SKSEVR entry."
requirements = [
  "Connect the headset through WiVRn before launching.",
  "Keep one MGO OpenComposite variant enabled in the selected MO2 profile, with its mod folder present.",
  "Keep the recognized VR Performance Kit variants disabled, including FSR - Use with DLAA and CAS Sharpening - Default.",
  "Use the MO2 shortcut's own Proton prefix rather than Skyrim's base-game prefix.",
  "Review PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES=1 in the MO2 shortcut's Steam launch options. The report checks simple leading environment assignments; wrappers may need manual review.",
]
notes = [
  "The October 17 setup check found Open Composite Unleashed for Skyrim VR 171182 5.0.4 2026 enabled and the older XR entry disabled. This was a setup check, not a new gameplay test.",
  "Passing setup checks does not confirm that the game is currently working in VR.",
  "Use Jackify or Wabbajack to install and update Mad God’s Overhaul.",
]

[compatibility.reference]
tested_on = "2026-10-17"
source = "User-reported dev3-fix1 local-check report and live launch/controller regression test on October 17; earlier dev2 reconnect reports."
system = "CachyOS; WiVRn; xrizer host adapter."
headset = "Meta Quest 3"
modlist = "Mad God's Overhaul 3.8"
proton = "GE-Proton10-14 (MO2 shortcut)"
result = "Dev3-fix1 local checks passed with OpenComposite Unleashed enabled; user confirmed the game enters normally and controllers work. Earlier dev2 completed CONNECTED -> UNKNOWN -> CONNECTED."
