url = "https://github.com/Okabintaro/SubmersedVR/releases/tag/0.2.1"
[[links]]
label = "SubmersedVR setup and Linux guidance"
url = "https://github.com/Okabintaro/SubmersedVR#linux-setup"

[[packages]]
id = "loader"
name = "Tobey's BepInEx pack 5.4.23-pack.3.1.1"
page = "https://github.com/toebeann/BepInEx.Subnautica/releases/tag/v5.4.23-pack.3.1.1"
sha256 = "21a1fd6ec22253a6cf05ccf1f6407f6055c95971a7dda7545b33481069a4dd3e"
required_files = ["winhttp.dll", "doorstop_config.ini", "BepInEx/core/BepInEx.dll", "BepInEx/core/BepInEx.Preloader.dll", "steam_appid.txt"]
[[packages]]
id = "submersedvr"
name = "SubmersedVR 0.2.1"
page = "https://github.com/Okabintaro/SubmersedVR/releases/tag/0.2.1"
sha256 = "66837e5e61d4abfe93e3e18101bd6a03bbcdbc7b1f6c8d24ee118d3eedcc0c55"
required_files = ["BepInEx/plugins/SubmersedVR.dll", "Subnautica_Data/Managed/SteamVR.dll", "Subnautica_Data/Managed/SteamVR_Actions.dll", "Subnautica_Data/StreamingAssets/SteamVR/actions.json", "Subnautica_Data/StreamingAssets/SteamVR/bindings_oculus_touch.json", "Subnautica_Data/StreamingAssets/SteamVR/bindings_knuckles.json", "Subnautica_Data/StreamingAssets/SteamVR/bindings_holographic.json"]

[launch]
args = "-vrmode openvr"
env = { WINEDLLOVERRIDES = "winhttp=n,b", PRESSURE_VESSEL_IMPORT_OPENXR_1_RUNTIMES = "1", PRESSURE_VESSEL_FILESYSTEMS_RW = '"$XDG_RUNTIME_DIR/wivrn/comp_ipc"' }

[[updates]]
name = "SubmersedVR (pinned build; review before updating)"
github = "Okabintaro/SubmersedVR"
tracks = ["subnautica"]
[[updates]]
name = "Tobey's BepInEx pack (pinned build; review before updating)"
github = "toebeann/BepInEx.Subnautica"
tracks = ["subnautica"]

[requirements]
openxr = "wivrn"
proton_prefix = true

