id = "subnautica"
name = "Subnautica (SubmersedVR)"
steam_appid = 264710
handler = "submersed-vr"
method = "bepinex"
manual_download = true
mod_page = "https://github.com/Okabintaro/SubmersedVR/releases/tag/0.2.1"

setup = [
  "Use Steam's default Subnautica branch with your existing working Proton. Launch once and close the game.",
  "Download SubmersedVR_0.2.1.zip and Tobey.s.BepInEx.Pack.for.Subnautica.zip (5.4.23-pack.3.1.1) from the linked releases, not source-code ZIPs or Below Zero files.",
  "In Install / Update, scan local archives and choose Install verified dependencies when both downloads are verified. Review the installation and backups.",
  "Remove an existing recorded Hub installation before replacing it. Remove conflicting VR Enhancements or older SN1MC/Motion Controls using their original removal instructions. The Hub cannot detect every conflict.",
  "Select xrizer with WiVRn. Copy the Hub launch options into Steam Properties > General; the Hub does not edit Steam settings.",
]
play = [
  "Connect your headset through WiVRn. In Steam choose Launch Subnautica in Steam VR Mode, not regular Play Subnautica.",
  "Load a save and check full VR, tracking, movement and interaction. No UEVR injector is needed.",
  "Keep default Touch controls: Y opens the PDA; hold A and drag an item into a quick slot. Avoid the in-game binding editor, which got stuck during testing.",
  "Record the gameplay result. If VR or controllers fail, check Game log diagnostics.",
]
good_to_know = [
  "The October 19–20 player tests confirmed core VR and the listed controls. Other setups and longer sessions are not guaranteed.",
  "Newer downloads require review. Uninstall through the Hub to restore original files; changed binaries or missing backups require review. Saves and unrelated mods are not installation targets.",
]

