  "Test headset rendering, stereo depth, head tracking, movement/turning, both controllers, PDA/tool use and interaction in a loaded save. Confirm stock Y/PDA and hold-A-and-drag quick-slot use. The binding editor remains a known limitation.",
]
notes = [
