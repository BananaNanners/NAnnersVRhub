validation = "user-reported"
proton = "Reuse the Steam-selected Proton build and Subnautica's own prefix. The successful test snapshot recorded proton-cachyos-slr in config_info; the exact build and running Steam selection were not inspected."
adapter = "SubmersedVR OpenVR bindings -> host xrizer -> WiVRn/OpenXR. Host configuration and installed files do not prove which libraries Steam/game loads."
launch = "Connect WiVRn -> Steam Launch Subnautica in Steam VR Mode with winhttp override, runtime visibility and -vrmode openvr -> loaded gameplay. No UEVR injector step."
requirements = [
  "Use the default Windows Steam game branch and its existing Proton prefix.",
  "Install the matching pinned loader and SubmersedVR archives together, including all controller bindings.",
  "Select host xrizer and connect the headset through WiVRn before launch.",
  "Choose Launch Subnautica in Steam VR Mode; review the copied Steam launch options and remove incompatible older VR plugins.",
  "Use stock Touch bindings: Y for the PDA; hold A and drag items into quick slots. Avoid the in-game binding editor.",
]
manual_checks = [
