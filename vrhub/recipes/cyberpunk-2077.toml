id = "cyberpunk-2077"
name = "Cyberpunk 2077 (CyberpunkVR Port, experimental)"
steam_appid = 1091500
mod_page = "https://www.nexusmods.com/cyberpunk2077/mods/30093"
manual_download = true
# Mod archives are unpacked straight into the game folder (several at once, in the order given).
method = "gameroot"
nexus_game = "cyberpunk2077"
track_component_updates = true

setup = [
  "Launch the unmodified game once using Proton. This guide covers the older tested CyberpunkVR Port v0.1.7 workflow for patch 2.31; newer releases need separate compatibility review.",
  "Enable the version DLL override using protontricks 1091500 --gui: choose the default wineprefix, run winecfg, open Libraries, add version and apply. Copy the Hub launch options into Steam Properties > General.",
  "Download the main files for prerequisite mods 1–14 from the checklist source pages. Keep their original Nexus filenames; do not select optional or test files.",
  "In Install / Update, scan local archives. Use More installation tools > Choose archives manually… to review the batch of prerequisites. Review destinations and backups before approval.",
  "Once the prerequisite checklist is READY, launch the game without VR and quit so the mod loaders can finish their first setup.",
  "Download the supported CyberpunkVR Port (last checklist entry), scan again, select it and review installation. Stage 2 remains blocked until its requirements are met.",
]

play = [
  "Start WiVRn and connect your headset before launching Cyberpunk 2077 through Steam.",
  "Use the supplied VR graphics preset. The author's pre-launch headset picker has not been verified under Proton.",
  "F10 opens settings, F7 recenters, and F8 changes the VR menu view in the tested build.",
  "If VR stays flat, in loaded gameplay turn off General > VR menu quad, HUD > Enable HUD panel and HUD > World-space interactions / dialogs. Close F10 completely before checking immersion.",
]

good_to_know = [
  "Experimental: immersion was confirmed with the HUD workaround, but stereo depth, longer sessions and restoring HUD features remain untested.",
  "Remove other VR injectors using their original removal instructions before installing. Codeware must be 1.20 or newer for this workflow.",
  "If the game fails to start, check the required mods and game logs. Do not bypass the Hub readiness guard as a normal setup step.",
  "Newer CyberpunkVR Port releases need review; do not assume they work with this guide. Uninstall through the Hub only after reviewing backups. Steam verification does not remove every extra mod file.",
]

